port: 7880

rtc:
  tcp_port: 7881

  # Single muxed UDP port instead of a 50000-50100 range. With a range the
  # server offers a pile of ICE candidates and the client spends the first
  # second hopping between them; one port connects cleanly and is the
  # recommended setup for a single-node SFU. 5 people fit through it fine.
  udp_port: 7882

  # This box has TWO public IPs (80.74.28.181 and 103.137.251.214) on the same
  # interface, so auto-detection must never be trusted here: if the advertised
  # address is not one the client can actually reach, ICE fails and nothing
  # connects (while the web page still loads fine, which makes it a nasty bug).
  #
  # We pin 80.74.28.181 because 103.137.251.214 is blocked by RKN and Russian
  # users cannot reach it without a VPN. 103.x is the default route source, so
  # LiveKit must send media from the socket bound to 80.74.28.181 instead —
  # verify with `ss -ulnp | grep 7882` that it is bound to this address.
  use_external_ip: false
  node_ip: 80.74.28.181

  # Advertise exactly one address and nothing else.
  #
  # By default WebRTC offers every local interface as an ICE candidate. On this
  # box that meant handing clients the server's public IPv6 AND fd42:42:42::1,
  # a private AmneziaWG (VPN) address that is unreachable from the internet.
  # A client would latch onto an IPv6 pair, send 8 STUN requests, get 0
  # responses and give up with "could not establish pc connection" — while
  # another client on plain IPv4 connected fine, which makes it look like the
  # server is broken rather than the candidate list.
  #
  # Restricting to the one reachable IPv4 removes every dead path.
  # Note: these are CIDR ranges, not bare addresses — a plain IP here makes
  # LiveKit fail to start with "invalid CIDR address".
  ips:
    includes:
      - 80.74.28.181/32

# TURN relay. Without this, anyone whose provider or router blocks direct UDP
# simply cannot connect: the signalling succeeds, then ICE fails and the client
# shows "could not establish pc connection". That happened to one of the five
# on a mobile-ISP address while another connected fine over plain UDP.
#
# tls_port 5349 is the important one — TURN over TLS looks like ordinary HTTPS
# traffic and survives firewalls that drop everything else.
turn:
  enabled: true
  domain: vox.80.74.28.181.nip.io
  cert_file: /etc/letsencrypt/live/vox.80.74.28.181.nip.io/fullchain.pem
  key_file: /etc/letsencrypt/live/vox.80.74.28.181.nip.io/privkey.pem
  tls_port: 5349
  udp_port: 3478

# Keys deliberately NOT in this file — it is committed to git.
# They come from the LIVEKIT_KEYS env var, set in deploy/.env (gitignored):
#   LIVEKIT_KEYS="APIxxxxxxxx: <secret>"
# Generate a pair with:  docker run --rm livekit/livekit-server generate-keys

room:
  max_participants: 5
  empty_timeout: 300
  departure_timeout: 20

logging:
  level: info
  json: false
