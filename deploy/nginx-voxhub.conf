# voxhub — served on 8446 because 443 is taken by xray and 9443 by jira.
server {
    # nginx 1.24 here — http2 goes on the listen line, not its own directive.
    listen 8446 ssl http2;
    server_name vox.80.74.28.181.nip.io;

    ssl_certificate     /etc/letsencrypt/live/vox.80.74.28.181.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vox.80.74.28.181.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # getDisplayMedia requires a secure context; this header keeps it that way.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # LiveKit signalling. This is a long-lived websocket — without the upgrade
    # headers and long timeouts the call drops every 60 seconds.
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # LiveKit server API (room management), same origin for convenience.
    location /twirp {
        proxy_pass http://127.0.0.1:7880;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Token server + built client.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
