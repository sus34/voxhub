name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Клиент
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установить зависимости
        working-directory: web
        run: npm ci

      - name: Собрать
        working-directory: web
        run: npm run build

      - name: Проверить, что сборка не пустая
        working-directory: web
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "bundle: $(du -sh dist | cut -f1)"

  server:
    name: Сервер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Установить зависимости
        working-directory: server
        run: npm ci

      - name: Проверить синтаксис
        working-directory: server
        run: for f in src/*.js; do node --check "$f"; done

      - name: Тесты API
        working-directory: server
        run: npm test

      - name: Сервер стартует на пустой базе и просит настройку
        working-directory: server
        env:
          LIVEKIT_API_KEY: APItest
          LIVEKIT_API_SECRET: test-secret-for-ci-only
          LIVEKIT_URL: wss://example.invalid
          DATA_DIR: ${{ runner.temp }}/voxhub-data
          PORT: 3999
        run: |
          node src/index.js > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3999/api/state && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3999/api/state | grep -q '"needsSetup":true'
          grep -q 'код настройки' server.log
          test -f "$DATA_DIR/voxhub.db"
          kill $PID

  secrets:
    name: Секреты не утекли
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A committed .env is the one mistake that matters in this repo.
      - name: Ни одного .env в трекинге
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env попал в репозиторий"
            exit 1
          fi
          echo "ok: только .env.example"

      # The SQLite file holds password hashes and sessions.
      - name: Ни одной базы в трекинге
        run: |
          if git ls-files | grep -E '\.(db|db-wal|db-shm|sqlite)$'; then
            echo "::error::база данных попала в репозиторий"
            exit 1
          fi
          echo "ok: баз нет"

      - name: Нет ключей LiveKit в конфигах
        run: |
          if grep -rnE '^\s*keys:\s*$' -A2 deploy/livekit.yaml | grep -qE 'API[A-Za-z0-9]{8,}'; then
            echo "::error::ключ LiveKit в livekit.yaml"
            exit 1
          fi
          echo "ok: ключи только в env"
